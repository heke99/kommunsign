name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.16.0', cache: npm }
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run web:build
      - run: npm run sbom
      - name: Verify generated artifacts
        run: |
          test -s build/sbom/kommunsign.cdx.json
          test -s build/public-site/index.html
          test -s build/portals/onboarding-portal/index.html
          test -s build/portals/tenant-portal/index.html
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      CONTROL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kommunsign_control
      DATA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kommunsign_data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated databases
        run: |
          createdb -h 127.0.0.1 -U postgres kommunsign_control
          createdb -h 127.0.0.1 -U postgres kommunsign_data
      - run: bash scripts/db-migrate.sh
      - run: bash scripts/db-verify.sh
