name: remediation-2026-08-10
on:
  push:
    branches:
      - remediation/kommunsign-full-product-completion-2026-08-10
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply remediation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f docs/audits/2026-08-10-full-product-completion/PATCH_APPLIED.md ]; then
            python3 scripts/repair-remediation-script-v9.py
            python3 scripts/apply-full-product-remediation.py
            cat > docs/audits/2026-08-10-full-product-completion/PATCH_APPLIED.md <<'EOF'
          # Patch applied — 2026-08-10

          Server-authoritative case detail remediation and concurrent tenant discovery were applied by GitHub Actions.
          EOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/src/production-adapters/postgres/data-database.ts apps/api/src/production-adapters/postgres/authentication-repository.ts apps/tenant-portal/public/app.js apps/tenant-portal/public/index.html docs/audits/2026-08-10-full-product-completion/PATCH_APPLIED.md
            git commit -m "fix: make case detail server authoritative"
            git push
          fi
      - name: Full repository verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="docs/audits/2026-08-10-full-product-completion/VERIFY_${GITHUB_RUN_ID}.log"
          mkdir -p docs/audits/2026-08-10-full-product-completion
          npm ci --ignore-scripts
          npm run verify > "$LOG" 2>&1
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            cat "$LOG"
            LOG="$LOG" python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          p=Path(os.environ['LOG']); body=base64.b64encode(p.read_bytes()).decode(); path=str(p).replace('\\','/')
          payload=json.dumps({'message':f'chore: persist verification diagnostics {os.environ["GITHUB_RUN_ID"]}','content':body,'branch':os.environ['GITHUB_REF_NAME']}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/heke99/kommunsign/contents/{path}',data=payload,method='PUT',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as r: print(r.read().decode())
          PY
            exit "$CODE"
          fi
      - name: Record successful verification
        if: success()
        run: |
          cat > docs/audits/2026-08-10-full-product-completion/VERIFICATION_COMPLETE.md <<'EOF'
          # Verification complete — 2026-08-10

          The complete repository verification passed in GitHub Actions on Node 22.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/2026-08-10-full-product-completion/VERIFICATION_COMPLETE.md
          git commit -m "test: record full verification" || true
          git push
