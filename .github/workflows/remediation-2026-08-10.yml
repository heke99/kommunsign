name: remediation-2026-08-10
on:
  push:
    branches:
      - remediation/kommunsign-full-product-completion-2026-08-10
permissions:
  contents: write
jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply server-authoritative case detail remediation
        id: patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          marker = Path('docs/audits/2026-08-10-full-product-completion/PATCH_APPLIED.md')
          if marker.exists():
              print('PATCH_ALREADY_APPLIED')
              raise SystemExit(0)

          # DATA: make GET case detail server-authoritative and tenant-scoped.
          p = Path('apps/api/src/production-adapters/postgres/data-database.ts')
          s = p.read_text()
          if 'interface CaseDetailRow' not in s:
              m = re.search(r'(interface CaseRow\s*\{.*?\n\})', s, re.S)
              if not m:
                  raise SystemExit('CaseRow interface not found')
              detail = '''\ninterface CaseDetailRow extends CaseRow {\n  readonly policy_id: string;\n  readonly policy_version: number|string;\n  readonly policy_snapshot: Readonly<Record<string, unknown>>;\n  readonly created_by: string;\n  readonly sent_at: string|Date|null;\n  readonly completed_at: string|Date|null;\n  readonly expires_at: string|Date|null;\n  readonly updated_at: string|Date;\n  readonly evidence_available: boolean;\n  readonly archive_completed: boolean;\n}\n'''
              s = s[:m.end()] + detail + s[m.end():]

          old_get = re.search(r"    async get\(context, id\) \{.*?\n    \},\n    async list\(context, page\)", s, re.S)
          if not old_get:
              raise SystemExit('case get block not found')
          new_get = '''    async get(context, id) {
      return tenantTx(database, context, async (transaction) => {
        const result = await transaction.query<CaseDetailRow>(
          `select c.id,c.tenant_id,c.status::text as status,c.status_version,c.decision_mode::text as decision_mode,
                  c.title,c.external_reference,c.policy_id,c.policy_version,c.policy_snapshot,
                  c.created_by,c.created_at,c.sent_at,c.completed_at,c.expires_at,c.updated_at,
                  exists(select 1 from app.evidence_packages ep where ep.tenant_id=c.tenant_id and ep.signature_case_id=c.id and ep.status='ready') as evidence_available,
                  exists(select 1 from app.archive_exports ae where ae.tenant_id=c.tenant_id and ae.signature_case_id=c.id and ae.status='completed') as archive_completed
             from app.signature_cases c
            where c.tenant_id=$1 and c.id=$2`,
          [context.tenantId, id],
        );
        const row = result.rows[0];
        if (!row) return null;
        const documents = await transaction.query<{ readonly payload: unknown }>(
          `select coalesce(jsonb_agg(jsonb_build_object(
             'id',d.id,'displayName',d.display_name,'role',d.document_role,'ordinal',d.document_ordinal,
             'version',v.version,'status',v.status::text,'mimeType',v.mime_type,'byteSize',v.byte_size,'sha256',v.sha256,
             'sourcePageCount',v.source_page_count,'canonicalPageCount',v.canonical_page_count,'pdfProfile',v.pdf_profile,'lockedAt',v.locked_at,
             'scanResult',(select sr.result from app.document_scan_results sr where sr.tenant_id=d.tenant_id and sr.document_version_id=v.id order by sr.scanned_at desc limit 1),
             'processingResult',(select pr.result from app.document_processor_reports pr where pr.tenant_id=d.tenant_id and pr.document_version_id=v.id order by pr.created_at desc limit 1)
           ) order by d.document_ordinal,d.created_at,d.id), '[]'::jsonb) as payload
             from app.documents d
             join lateral (select v.* from app.document_versions v where v.tenant_id=d.tenant_id and v.document_id=d.id order by v.version desc limit 1) v on true
            where d.tenant_id=$1 and d.signature_case_id=$2`, [context.tenantId,id],
        );
        const signers = await transaction.query<{ readonly payload: unknown }>(
          `select coalesce(jsonb_agg(jsonb_build_object(
             'id',s.id,'displayName',s.display_name,'status',s.status::text,'signingOrder',s.signing_order,'required',s.required,
             'identifierBindingMode',s.identifier_binding_mode,'identifierBindingExceptionCode',s.identifier_binding_exception_code,
             'emailConfigured',(s.email_ciphertext is not null)
           ) order by s.signing_order,s.id), '[]'::jsonb) as payload
             from app.signers s where s.tenant_id=$1 and s.signature_case_id=$2`, [context.tenantId,id],
        );
        const events = await transaction.query<{ readonly payload: unknown }>(
          `select coalesce(jsonb_agg(jsonb_build_object('id',a.id,'type',a.event_type,'category',a.category,'actorType',a.actor_type,'resourceType',a.resource_type,'resourceId',a.resource_id,'occurredAt',a.occurred_at) order by a.sequence), '[]'::jsonb) as payload
             from audit.audit_events a where a.tenant_id=$1 and a.resource_type='signature_case' and a.resource_id=$2`, [context.tenantId,id],
        );
        const view = caseView(row);
        return { ...view,
          policy: { id: row.policy_id, version: Number(row.policy_version), snapshot: row.policy_snapshot },
          createdBy: row.created_by, createdAt: iso(row.created_at),
          sentAt: row.sent_at ? iso(row.sent_at) : undefined,
          completedAt: row.completed_at ? iso(row.completed_at) : undefined,
          expiresAt: row.expires_at ? iso(row.expires_at) : undefined,
          updatedAt: iso(row.updated_at),
          documents: documents.rows[0]?.payload ?? [],
          signers: signers.rows[0]?.payload ?? [],
          events: events.rows[0]?.payload ?? [],
          evidenceAvailable: row.evidence_available,
          archiveCompleted: row.archive_completed,
        };
      });
    },
    async list(context, page)'''
          s = s[:old_get.start()] + new_get + s[old_get.end():]
          p.write_text(s)

          # AUTH: resolve multiple tenant memberships concurrently rather than serially.
          p = Path('apps/api/src/production-adapters/postgres/authentication-repository.ts')
          s = p.read_text()
          old = '''    for (const membership of memberships.rows) {
      try { return await primaryTenantDestination(controlDatabase, membership.tenant_id, tenantDiscoveryHostname); }
      catch (cause) { if (!(cause instanceof Error) || cause.message !== 'ORGANIZATION_PRIMARY_DOMAIN_NOT_ACTIVE') throw cause; }
    }
    throw new Error('AUTH_ACCOUNT_NOT_AUTHORIZED');'''
          new = '''    const destinations = await Promise.all(memberships.rows.map(async (membership) => {
      try { return await primaryTenantDestination(controlDatabase, membership.tenant_id, tenantDiscoveryHostname); }
      catch (cause) {
        if (cause instanceof Error && cause.message === 'ORGANIZATION_PRIMARY_DOMAIN_NOT_ACTIVE') return null;
        throw cause;
      }
    }));
    const destination = destinations.find((value): value is ResolvedDestination => value !== null);
    if (destination) return destination;
    throw new Error('AUTH_ACCOUNT_NOT_AUTHORIZED');'''
          if old not in s:
              raise SystemExit('auth serial membership block not found')
          p.write_text(s.replace(old,new,1))

          # TENANT PORTAL: remove browser-only caseDetails state and hydrate from server.
          p = Path('apps/tenant-portal/public/app.js')
          s = p.read_text()
          if 'const caseDetails=new Map()' not in s:
              raise SystemExit('caseDetails browser state not found')
          s = s.replace("const byId=(id)=>document.getElementById(id);let cases=[];let signaturePolicies=[];let sequence=0;const caseDetails=new Map();", "const byId=(id)=>document.getElementById(id);let cases=[];let signaturePolicies=[];let sequence=0;let selectedCaseDetail=null;")
          old_detail = "function detail(id){if(!caseDetails.has(id))caseDetails.set(id,{documents:[],signers:[]});return caseDetails.get(id);}"
          new_detail = """async function loadCaseDetail(id){selectedCaseDetail=await body(await api(`/v1/signature-cases/${id}`));renderCaseDetail();return selectedCaseDetail;}
          function renderCaseDetail(){const root=byId('case-detail-content');if(!root)return;root.replaceChildren();const d=selectedCaseDetail;if(!d){root.innerHTML='<p class=\"muted\">Välj ett ärende för att läsa serverns aktuella status.</p>';return;}const h=document.createElement('h3');h.textContent=d.title;root.append(h);const facts=document.createElement('dl');facts.className='facts';for(const [label,value] of [['Status',caseStatus(d.status)],['Beslutsform',d.decisionMode],['Skapad',new Date(d.createdAt).toLocaleString('sv-SE')],['Skickad',d.sentAt?new Date(d.sentAt).toLocaleString('sv-SE'):'—'],['Slutförd',d.completedAt?new Date(d.completedAt).toLocaleString('sv-SE'):'—'],['Policy',`${d.policy?.id||'—'} v${d.policy?.version||'—'}`]]){const box=document.createElement('div');const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');dd.textContent=String(value);box.append(dt,dd);facts.append(box);}root.append(facts);const docs=document.createElement('section');docs.innerHTML='<h4>Handlingar</h4>';for(const file of d.documents||[]){const p=document.createElement('p');p.textContent=`${file.displayName} · v${file.version} · ${file.status} · ${file.pdfProfile||'profil ej fastställd'} · ${file.sha256||'hash saknas'}`;docs.append(p);}if(!d.documents?.length)docs.insertAdjacentHTML('beforeend','<p class=\"warning\">Inga handlingar.</p>');root.append(docs);const signers=document.createElement('section');signers.innerHTML='<h4>Signerare</h4>';for(const signer of d.signers||[]){const p=document.createElement('p');p.textContent=`${signer.displayName||'Signerare'} · grupp ${signer.signingOrder} · ${signer.status} · ${signer.required?'obligatorisk':'valfri'} · ${bindingLabel(signer.identifierBindingMode)}`;signers.append(p);}if(!d.signers?.length)signers.insertAdjacentHTML('beforeend','<p class=\"warning\">Inga signerare.</p>');root.append(signers);const events=document.createElement('section');events.innerHTML='<h4>Händelser</h4>';for(const event of d.events||[]){const p=document.createElement('p');p.textContent=`${new Date(event.occurredAt).toLocaleString('sv-SE')} · ${event.type}`;events.append(p);}if(!d.events?.length)events.insertAdjacentHTML('beforeend','<p class=\"muted\">Ingen audit-historik för ärendet ännu.</p>');root.append(events);const availability=document.createElement('p');availability.className='muted';availability.textContent=`Bevispaket: ${d.evidenceAvailable?'tillgängligt':'inte tillgängligt'} · Arkiv: ${d.archiveCompleted?'slutfört':'inte slutfört'}.`;root.append(availability);}"
          if old_detail not in s:
              raise SystemExit('detail helper not found')
          s = s.replace(old_detail,new_detail,1)
          old_render = "function renderCases(){const tbody=byId('case-list');tbody.replaceChildren();for(const item of cases){const row=document.createElement('tr');const title=document.createElement('td');title.textContent=item.title;const state=document.createElement('td');const badge=document.createElement('span');badge.className='badge';badge.textContent=caseStatus(item.status);state.append(badge);const version=document.createElement('td');version.textContent=String(item.statusVersion||1);const action=document.createElement('td');const send=document.createElement('button');send.type='button';send.textContent='Skicka';send.disabled=!['draft','ready'].includes(item.status);send.addEventListener('click',()=>sendCase(item));const remind=document.createElement('button');remind.type='button';remind.className='secondary';remind.textContent='Påminn';remind.disabled=!['sent','in_progress','partially_signed'].includes(item.status);remind.addEventListener('click',()=>remindCase(item));const cancel=document.createElement('button');cancel.type='button';cancel.className='secondary danger-text';cancel.textContent='Avbryt';cancel.disabled=['completed','cancelled','declined'].includes(item.status);cancel.addEventListener('click',()=>cancelCase(item));action.className='actions';action.append(send,remind,cancel);row.append(title,state,version,action);tbody.append(row);}"
          new_render = "function renderCases(){const tbody=byId('case-list');tbody.replaceChildren();for(const item of cases){const row=document.createElement('tr');const title=document.createElement('td');title.textContent=item.title;const state=document.createElement('td');const badge=document.createElement('span');badge.className='badge';badge.textContent=caseStatus(item.status);state.append(badge);const version=document.createElement('td');version.textContent=String(item.statusVersion||1);const action=document.createElement('td');const view=document.createElement('button');view.type='button';view.textContent='Visa';view.addEventListener('click',()=>loadCaseDetail(item.id).catch(error=>status('case-status',error.message,'error')));const send=document.createElement('button');send.type='button';send.textContent='Skicka';send.disabled=!['draft','ready'].includes(item.status);send.addEventListener('click',()=>sendCase(item));const remind=document.createElement('button');remind.type='button';remind.className='secondary';remind.textContent='Påminn';remind.disabled=!['sent','in_progress','partially_signed'].includes(item.status);remind.addEventListener('click',()=>remindCase(item));const cancel=document.createElement('button');cancel.type='button';cancel.className='secondary danger-text';cancel.textContent='Avbryt';cancel.disabled=['completed','cancelled','declined'].includes(item.status);cancel.addEventListener('click',()=>cancelCase(item));action.className='actions';action.append(view,send,remind,cancel);row.append(title,state,version,action);tbody.append(row);}"
          if old_render not in s:
              raise SystemExit('renderCases block not found')
          s = s.replace(old_render,new_render,1)
          s = s.replace("detail(caseId).documents.push({...view,sha256:digest});status('document-status'", "await loadCaseDetail(caseId);status('document-status'",1)
          s = s.replace("detail(caseId).signers.push(signer);status('signer-status'", "await loadCaseDetail(caseId);status('signer-status'",1)
          s = s.replace("const d=detail(id);", "if(!selectedCaseDetail||selectedCaseDetail.id!==id){root.innerHTML='<p class=\"muted\">Tryck Visa eller uppdatera ärendet för att hämta aktuell serverstatus.</p>';return;}const d=selectedCaseDetail;",1)
          s = s.replace("byId('mode').addEventListener('change',renderPolicies);byId('preview-case').addEventListener('change',renderPreview);", "byId('mode').addEventListener('change',renderPolicies);byId('preview-case').addEventListener('change',()=>{renderPreview();loadCaseDetail(byId('preview-case').value).catch(error=>status('case-status',error.message,'error'));});",1)
          p.write_text(s)

          # TENANT PORTAL: add a visible server-authoritative detail surface.
          p = Path('apps/tenant-portal/public/index.html')
          s = p.read_text()
          if 'id="case-detail-content"' not in s:
              anchor = '<section class="card span-2" id="cases">'
              section = '<section class="card span-2" id="case-detail"><h2>Ärendedetaljer</h2><div id="case-detail-content" class="preview"><p class="muted">Välj Visa på ett ärende för att hämta aktuell serverstatus.</p></div></section>'
              if anchor not in s:
                  raise SystemExit('cases anchor not found')
              s = s.replace(anchor, section + anchor, 1)
              s = s.replace('Välj ett ärende för att se lokalt registrerade handlingar och signerare.', 'Välj ett ärende och hämta serverns aktuella handlingar och signerare.',1)
              p.write_text(s)

          marker.parent.mkdir(parents=True, exist_ok=True)
          marker.write_text('''# Patch applied — 2026-08-10\n\nApplied by GitHub Actions from the remediation branch.\n\nChanges:\n- GET signature-case detail now reads documents, signers, audit events, evidence and archive state from DATA under the authenticated tenant transaction.\n- Tenant portal no longer keeps authoritative document/signer state in a browser-only Map.\n- Authentication tenant discovery resolves eligible memberships concurrently.\n- Portal exposes a server-authoritative case detail surface.\n''')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/production-adapters/postgres/data-database.ts apps/api/src/production-adapters/postgres/authentication-repository.ts apps/tenant-portal/public/app.js apps/tenant-portal/public/index.html docs/audits/2026-08-10-full-product-completion/PATCH_APPLIED.md
          git commit -m "fix: make case detail server authoritative" || true
          git push
      - name: Install and run full verification
        run: |
          npm ci --ignore-scripts
          npm run verify
      - name: Record verification result
        if: success()
        run: |
          cat > docs/audits/2026-08-10-full-product-completion/VERIFICATION_COMPLETE.md <<'EOF'
          # Verification complete — 2026-08-10

          `npm ci --ignore-scripts` and the repository's complete `npm run verify` passed in GitHub Actions on Node 22.

          This file is only written by the verification job after the full command succeeds.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/2026-08-10-full-product-completion/VERIFICATION_COMPLETE.md
          git commit -m "test: record full verification" || true
          git push
