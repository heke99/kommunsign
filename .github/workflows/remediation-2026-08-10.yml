name: remediation-2026-08-10
on:
  push:
    branches:
      - remediation/kommunsign-full-product-completion-2026-08-10
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply remediation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f docs/audits/2026-08-10-full-product-completion/PATCH_APPLIED.md ]; then
            mkdir -p docs/audits/2026-08-10-full-product-completion
            DEBUG_FILE="docs/audits/2026-08-10-full-product-completion/REMEDIATION_DEBUG_${GITHUB_RUN_ID}.log"
            : > "$DEBUG_FILE"
            set +e
            python3 scripts/repair-remediation-script-v7.py >> "$DEBUG_FILE" 2>&1
            R1=$?
            python3 scripts/apply-full-product-remediation.py >> "$DEBUG_FILE" 2>&1
            R2=$?
            set -e
            if [ "$R1" -ne 0 ] || [ "$R2" -ne 0 ]; then
              cat "$DEBUG_FILE"
              DEBUG_FILE="$DEBUG_FILE" python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          p = Path(os.environ['DEBUG_FILE'])
          body = base64.b64encode(p.read_bytes()).decode()
          path = str(p).replace('\\','/')
          payload = json.dumps({'message':f'chore: persist remediation diagnostics {os.environ["GITHUB_RUN_ID"]}','content':body,'branch':os.environ['GITHUB_REF_NAME']}).encode()
          req = urllib.request.Request(f'https://api.github.com/repos/heke99/kommunsign/contents/{path}', data=payload, method='PUT', headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as response:
              print(response.read().decode())
          PY
              exit 1
            fi
            cat > docs/audits/2026-08-10-full-product-completion/PATCH_APPLIED.md <<'EOF'
          # Patch applied — 2026-08-10

          Server-authoritative case detail remediation and concurrent tenant discovery were applied by GitHub Actions.
          EOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/src/production-adapters/postgres/data-database.ts apps/api/src/production-adapters/postgres/authentication-repository.ts apps/tenant-portal/public/app.js apps/tenant-portal/public/index.html scripts/apply-full-product-remediation.py scripts/repair-remediation-script-v7.py docs/audits/2026-08-10-full-product-completion/PATCH_APPLIED.md
            git commit -m "fix: make case detail server authoritative"
            git push
          fi
      - name: Full repository verification
        run: |
          npm ci --ignore-scripts
          npm run verify
      - name: Record successful verification
        if: success()
        run: |
          cat > docs/audits/2026-08-10-full-product-completion/VERIFICATION_COMPLETE.md <<'EOF'
          # Verification complete — 2026-08-10

          This file is written only after the complete `npm run verify` command succeeds in GitHub Actions on Node 22.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/2026-08-10-full-product-completion/VERIFICATION_COMPLETE.md
          git commit -m "test: record full verification" || true
          git push
