name: snapshot
on:
  push:
    branches:
      - remediation/kommunsign-full-product-completion-2026-08-10
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git -czf kommunsign-snapshot.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: kommunsign-snapshot
          path: kommunsign-snapshot.tgz
