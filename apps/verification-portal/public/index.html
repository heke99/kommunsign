<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KommunSign – verifiera</title><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head><body><a class="skip-link" href="#content">Hoppa till innehåll</a><header><strong>Verifiera underskrift</strong><span class="badge">Ingen permanent lagring</span></header><main id="content"><section class="card"><h1>Verifiera signerad PDF</h1><form id="verify-form"><label for="pdf">Signerad PDF</label><input id="pdf" type="file" accept="application/pdf" required><label for="endpoint">Valideringstjänst</label><input id="endpoint" value="http://127.0.0.1:8082/validate"><button type="submit">Förhandskontrollera och validera</button></form><div id="status" class="status" aria-live="polite">Ingen fil vald.</div><dl id="result"></dl><p class="muted">Lokal kontroll av PDF-magic bytes och SHA-256 är inte en signaturvalidering. Endast en verifierad DSS-rapport får ge TOTAL_PASSED.</p></section></main></body></html>
