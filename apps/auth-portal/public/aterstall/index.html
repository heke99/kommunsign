<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Återställ lösenord – Kommunsign</title><link rel="stylesheet" href="/app.css"></head><body><main class="shell"><div class="brand"><div class="mark" aria-hidden="true">KS</div><div><strong>Kommunsign</strong><span>Säker elektronisk underskrift</span></div></div><section class="card"><h1>Återställ ditt lösenord</h1><p>Välj ett personligt lösenord för ditt befintliga Kommunsign-konto.</p><form id="password-form"><label>Nytt lösenord<input id="new-password" type="password" autocomplete="new-password" minlength="12" required></label><label>Bekräfta lösenord<input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required></label><button type="submit">Spara nytt lösenord</button></form><div id="status" class="status hidden" role="status" aria-live="polite"></div><p class="fineprint">Lösenordet ska innehålla minst 12 tecken samt liten bokstav, stor bokstav, siffra och specialtecken.</p></section></main><script src="/app.js" defer></script></body></html>
